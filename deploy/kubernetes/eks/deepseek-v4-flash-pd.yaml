          resources:
            requests:
              cpu: "48"
              memory: 512Gi
              nvidia.com/gpu: "4"
            limits:
              cpu: "96"
              memory: 1024Gi
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /models
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
