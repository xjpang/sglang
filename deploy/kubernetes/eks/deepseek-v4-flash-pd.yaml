---
# SMG is the model gateway. The AWS NLB distributes connections across ready
# replicas; deterministic worker hashing preserves affinity across replicas.
apiVersion: v1
kind: Service
metadata:
  name: deepseek-v4-smg
  namespace: deepseek-v4
  labels:
    app.kubernetes.io/name: sgl-model-gateway
    app.kubernetes.io/instance: deepseek-v4-flash
    app.kubernetes.io/part-of: deepseek-v4-flash
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    # Safe default: private NLB. Change to internet-facing only after enabling
    # SMG API-key/TLS authentication or placing an authenticated gateway ahead.
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /health
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: traffic-port
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: sgl-model-gateway
    app.kubernetes.io/instance: deepseek-v4-flash
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
