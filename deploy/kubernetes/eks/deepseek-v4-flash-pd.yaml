---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: deepseek-v4-prefill
  namespace: deepseek-v4
  labels:
    app.kubernetes.io/name: deepseek-v4-flash
    app.kubernetes.io/component: prefill
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deepseek-v4-flash
      sglang.ai/role: prefill
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: deepseek-v4-decode
  namespace: deepseek-v4
  labels:
    app.kubernetes.io/name: deepseek-v4-flash
    app.kubernetes.io/component: decode
